{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Access Control Admin - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'frontend/css/style.css' %}">
</head>
<body class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">🛡️</div>
            <h2 class="login-title">SmartAccess</h2>
            <p class="login-subtitle">Administrative Portal Sign In</p>
        </div>

        <form id="form-login">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-control" placeholder="admin" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">
                Sign In
            </button>
        </form>

        <div class="status-banner error" id="login-error" style="font-size: 0.85rem; text-align: center; margin-top: 0.5rem; padding: 0.6rem; display: none;"></div>
    </div>

    <!-- Core APIs -->
    <script src="{% static 'frontend/js/api.js' %}"></script>
    <script>
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const errorBanner = document.getElementById('login-error');
            
            errorBanner.style.display = 'none';

            try {
                const res = await API.post('/api/v1/auth/login/', {
                    username: usernameInput.value,
                    password: passwordInput.value
                });

                if (res) {
                    showToast('Logged in successfully', 'success');
                    setTimeout(() => {
                        window.location.href = "{% url 'frontend:dashboard' %}";
                    }, 500);
                } else {
                    errorBanner.textContent = 'Invalid credentials or access restricted.';
                    errorBanner.style.display = 'block';
                }
            } catch (err) {
                errorBanner.textContent = 'Network error occurred.';
                errorBanner.style.display = 'block';
            }
        });
    </script>
</body>
</html>
